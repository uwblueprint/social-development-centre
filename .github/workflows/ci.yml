name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 can't install Chromium.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y
